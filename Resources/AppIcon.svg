<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- MemBar app icon ("Paper"): the menu bar glyph, 4 of 6 blocks lit. -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcfbf9"/>
      <stop offset="1" stop-color="#e7e5e0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#paper)" filter="url(#shadow)"/>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#000000" stroke-opacity="0.08" stroke-width="2"/>
  <g fill="#1b1b1a">
    <rect x="232" y="435" width="77" height="154" rx="13"/>
    <rect x="328.5" y="435" width="77" height="154" rx="13"/>
    <rect x="425" y="435" width="77" height="154" rx="13"/>
    <rect x="521.5" y="435" width="77" height="154" rx="13"/>
    <rect x="618" y="435" width="77" height="154" rx="13" opacity="0.18"/>
    <rect x="714.5" y="435" width="77" height="154" rx="13" opacity="0.18"/>
  </g>
</svg>
